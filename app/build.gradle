plugins { id 'com.android.application' }

android {
    namespace 'com.androidauto.mailcollector'
    compileSdk 36

    defaultConfig {
        applicationId 'com.androidauto.mailcollector'
        minSdk 28
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }
    packaging {
        resources {
            excludes += ['META-INF/LICENSE.txt', 'META-INF/LICENSE.md', 'META-INF/NOTICE.txt', 'META-INF/NOTICE.md', 'META-INF/DEPENDENCIES']
        }
    }
}

dependencies {
    implementation 'androidx.car.app:app:1.7.0'
    implementation 'androidx.car.app:app-projected:1.7.0'
    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    // Client IMAP (stessa libreria già usata per l'SMTP nel progetto MX-5 Driver Metrics)
    implementation 'com.sun.mail:android-mail:1.6.7'
    implementation 'com.sun.mail:android-activation:1.6.7'
}
